<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cœur Code — entrée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#FBF7F0; --carte:#FFFFFF; --bord:#2B2440; --bord-fin:rgba(43,36,64,.2);
  --encre:#191428; --second:#453B62; --sourd:#5E5280;
  --accent:#8A2B4A; --accent-doux:#FDEDF1;
  --display:'Fraunces',Georgia,serif; --corps:'Manrope',system-ui,sans-serif;
  --data:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--fond);color:var(--encre);font-family:var(--corps);
  -webkit-font-smoothing:antialiased;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.enveloppe{max-width:420px;margin:0 auto}

.entete{padding:20px 2px 14px;display:flex;align-items:center;gap:12px}
.marque{font-family:var(--display);font-size:20px}
.marque .c{color:var(--accent)}
.compte{margin-left:auto;font-family:var(--data);font-size:11px;letter-spacing:.14em;color:var(--sourd);font-weight:700}
.jauge{height:5px;background:var(--bord-fin);border-radius:5px;overflow:hidden;margin-bottom:26px}
.jauge i{display:block;height:100%;background:var(--accent);width:0;transition:width .45s cubic-bezier(.2,.7,.3,1)}

.ecran{display:none}
.ecran.actif{display:block;animation:monte .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes monte{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

h1{font-family:var(--display);font-weight:300;font-size:29px;line-height:1.18;margin-bottom:12px}
h1 em{font-style:normal;color:var(--accent)}
.vanne{color:var(--second);font-size:15px;line-height:1.55;margin-bottom:24px}
.vanne b{font-weight:700;color:var(--encre)}

.choix{display:flex;flex-direction:column;gap:9px}
.choix button{width:100%;text-align:left;font-family:var(--corps);font-size:16px;font-weight:600;
  color:var(--encre);background:var(--carte);border:2px solid var(--bord-fin);border-radius:14px;
  padding:17px 16px;min-height:60px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}
.choix button .e{font-size:21px;flex:0 0 auto}
.choix button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-doux)}
.choix button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

input{width:100%;font-family:var(--data);font-size:38px;font-weight:700;text-align:center;color:var(--accent);
  background:var(--carte);border:2px solid var(--bord);border-radius:14px;padding:20px;min-height:92px;appearance:none}
input:focus{outline:3px solid var(--accent);outline-offset:2px}
input::placeholder{color:var(--bord-fin)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.primaire{width:100%;font-family:var(--corps);font-size:17px;font-weight:700;color:#fff;background:var(--accent);
  border:0;border-radius:15px;padding:19px;min-height:62px;cursor:pointer;margin-top:20px}
.primaire:disabled{background:var(--bord-fin);color:var(--sourd);cursor:not-allowed}
.primaire:not(:disabled):active{transform:scale(.985)}
.retour{width:100%;background:none;border:0;font-family:var(--corps);font-size:14px;font-weight:600;
  color:var(--sourd);padding:14px;cursor:pointer;margin-top:4px}

.promesse{display:flex;align-items:flex-start;gap:13px;cursor:pointer;background:var(--carte);
  border:2px solid var(--bord-fin);border-radius:14px;padding:18px 16px;font-size:16px;font-weight:600;line-height:1.4}
.promesse input{width:auto;min-height:0;padding:0;flex:0 0 auto;position:absolute;opacity:0}
.case{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--bord);
  background:var(--fond);display:grid;place-items:center}
.promesse input:checked~.case{background:var(--accent);border-color:var(--accent)}
.case svg{opacity:0}.promesse input:checked~.case svg{opacity:1}

.fin{text-align:center;padding-top:10px}
.fin .coeur{font-size:64px;line-height:1;color:var(--accent)}
.fin .badge{font-family:var(--data);font-size:52px;font-weight:700;color:var(--accent);margin-top:10px}
.fin .sous{font-family:var(--data);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sourd);font-weight:700;margin-top:6px}
.fin p{color:var(--second);font-size:15.5px;line-height:1.6;margin-top:22px}
.anonyme{margin-top:24px;padding:16px;border-radius:14px;background:var(--accent-doux);
  font-size:14px;line-height:1.55;color:var(--second);text-align:left}
.anonyme b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="enveloppe">
  <header class="entete">
    <div class="marque">Cœur Code <span class="c">❤️</span></div>
    <div class="compte" id="compte"></div>
  </header>
  <div class="jauge"><i id="jauge"></i></div>
  <div id="scene"></div>
</div>

<script>
/* Cœur Code — entrée anonyme. Aucun nom, aucun prénom, aucun contact.
   Le numéro de badge est la seule identité de la soirée. */

const ECRANS=[
 {type:"intro",
  titre:"Bienvenue dans <em>Cœur Code</em>.",
  vanne:"Aujourd'hui, ton futur grand amour est peut-être à trois mètres de toi.<br><br>Ou alors ton futur trauma.<br><br>Dans les deux cas, on va essayer de faire la différence. 😌",
  bouton:"Commencer"},

 {id:"badge",type:"nombre",min:1,max:999,marque:"00",
  titre:"Ici, <em>personne n'a de nom</em>.",
  vanne:"Pas de prénom, pas de nom, pas de numéro de téléphone. Toute la soirée, tu es un chiffre. <b>Recopie celui de ton badge.</b>"},

 {id:"age",type:"nombre",min:18,max:99,marque:"00",
  titre:"Quel âge as-tu ?",
  vanne:"Sois honnête. Notre IA est très forte… <b>elle voit les rides à travers le Wi-Fi.</b>"},

 {id:"chabbat",type:"choix",
  titre:"Chabbat, pour toi, c'est…",
  vanne:"Première vraie question. Celle qui évite les malentendus du vendredi soir.",
  options:[["🕯️","Sacré, on ne négocie pas"],["🍷","Un vendredi soir en famille"],
           ["🏖️","Un samedi comme les autres"],["🤔","Ça dépend de qui m'invite"]]},

 {id:"cachere",type:"choix",
  titre:"Cachère ?",
  vanne:"Parce qu'un premier date au restaurant, ça se prépare.",
  options:[["✅","Strictement"],["🏠","À la maison oui, dehors on verra"],
           ["🥓","Pas du tout"],["😅","Je fais semblant devant ma mère"]]},

 {id:"enfants",type:"choix",
  titre:"Des enfants, <em>dans ta vie</em> ?",
  vanne:"On préfère demander maintenant que dans quatre ans.",
  options:[["👶","J'en veux"],["👨‍👩‍👧","J'en ai, j'en voudrais d'autres"],
           ["🧸","J'en ai déjà, et ça suffit"],["🚫","Non merci"],["🤷","On verra bien"]]},

 {id:"lieu",type:"choix",
  titre:"Tu habites où ?",
  vanne:"Histoire de savoir si l'amour nécessitera <b>un Uber à 120 ₪</b>.",
  options:[["🌊","Tel Aviv"],["🏙️","Ramat Gan, Guivataïm"],["🏖️","Herzliya, Netanya"],
           ["🕍","Jérusalem"],["🚗","Plus loin que ça"]]},

 {id:"flirt",type:"choix",
  titre:"Ton style de flirt ?",
  vanne:"Aucune mauvaise réponse. Enfin, presque.",
  options:[["😎","Je fais rire"],["🤓","Je parle pendant 45 minutes"],
           ["🙈","Je panique"],["😏","Je regarde, puis je disparais"]]},

 {id:"action",type:"choix",
  titre:"Si quelqu'un te plaît ce soir…",
  vanne:"On ne jugera pas. On notera, mais on ne jugera pas.",
  options:[["🗣️","Je vais lui parler"],["✨","J'attends un signe du destin"],
           ["🫂","J'envoie un ami"],["🏠","Je rentre et je regrette"]]},

 {id:"pourquoi",type:"choix",
  titre:"Pourquoi es-tu <em>vraiment</em> venu ?",
  vanne:"La question la plus utile de la soirée. Réponds vrai, c'est celle qui t'évitera de perdre cinq minutes.",
  options:[["❤️","Trouver quelqu'un"],["🍷","Boire un verre"],
           ["😂","Voir si cette IA raconte n'importe quoi"],["🤷","On m'a forcé"]]},

 {id:"promesse",type:"promesse",
  titre:"Dernière question…",
  vanne:"Promets-tu de ne pas dire : « en vrai, t'es plus beau qu'en photo » ?",
  texte:"Je le promets."},

 {type:"fin"}
];

const REP={};
let i=0;
const scene=document.getElementById('scene');

function rendre(){
  const e=ECRANS[i];
  const questions=ECRANS.filter(x=>x.id).length;
  const faites=ECRANS.slice(0,i).filter(x=>x.id).length;
  document.getElementById('jauge').style.width=(faites/questions*100)+'%';
  document.getElementById('compte').textContent=e.id?`${faites+1} / ${questions}`:'';

  let h='';
  if(e.type==="intro"){
    h=`<div class="ecran actif"><h1>${e.titre}</h1><p class="vanne">${e.vanne}</p>
       <button class="primaire" id="suite">${e.bouton} →</button></div>`;
  } else if(e.type==="nombre"){
    h=`<div class="ecran actif"><h1>${e.titre}</h1><p class="vanne">${e.vanne}</p>
       <input type="number" id="champ" inputmode="numeric" min="${e.min}" max="${e.max}" placeholder="${e.marque}" autocomplete="off">
       <button class="primaire" id="suite" disabled>Continuer</button>
       ${i>1?'<button class="retour" id="retour">← revenir</button>':''}</div>`;
  } else if(e.type==="choix"){
    h=`<div class="ecran actif"><h1>${e.titre}</h1><p class="vanne">${e.vanne}</p>
       <div class="choix">${e.options.map((o,k)=>
         `<button type="button" aria-pressed="false" data-k="${k}"><span class="e">${o[0]}</span>${o[1]}</button>`).join('')}</div>
       <button class="primaire" id="suite" disabled>Continuer</button>
       <button class="retour" id="retour">← revenir</button></div>`;
  } else if(e.type==="promesse"){
    h=`<div class="ecran actif"><h1>${e.titre}</h1><p class="vanne">${e.vanne}</p>
       <label class="promesse"><input type="checkbox" id="jure">
         <span class="case"><svg width="14" height="11" viewBox="0 0 14 11"><path d="M2 5.5l3.6 3.6L12 2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
         <span>${e.texte}</span></label>
       <button class="primaire" id="suite" disabled>Terminer</button>
       <button class="retour" id="retour">← revenir</button></div>`;
  } else {
    h=`<div class="ecran actif"><div class="fin">
       <div class="coeur">❤</div>
       <div class="badge">${String(REP.badge||0).padStart(2,'0')}</div>
       <div class="sous">ton nom pour ce soir</div>
       <p>Ton profil part entre les mains d'une intelligence artificielle. Si elle te trouve quelqu'un de bizarre, ce sera probablement parce que tu es bizarre aussi. ❤️</p>
       <div class="anonyme"><b>Personne ne saura qui tu es.</b> On n'a ni ton nom, ni ton téléphone, ni ton mail. À l'écran, tu es le ${REP.badge||0}. Si un cœur est mutuel, on te le dira à toi seul, et c'est toi qui décideras si tu donnes quelque chose.</div>
       </div></div>`;
  }
  scene.innerHTML=h;

  const suite=document.getElementById('suite');
  const retour=document.getElementById('retour');
  if(retour) retour.onclick=()=>{i--; while(i>0 && !ECRANS[i].id && ECRANS[i].type!=="intro") i--; rendre();};

  if(e.type==="nombre"){
    const c=document.getElementById('champ');
    if(REP[e.id]) c.value=REP[e.id];
    const ok=()=>{const v=parseInt(c.value,10);return Number.isInteger(v)&&v>=e.min&&v<=e.max;};
    suite.disabled=!ok();
    c.oninput=()=>{suite.disabled=!ok();};
    c.onkeydown=ev=>{if(ev.key==="Enter"&&!suite.disabled)suite.click();};
    suite.onclick=()=>{REP[e.id]=parseInt(c.value,10); i++; rendre();};
    setTimeout(()=>c.focus(),120);
  } else if(e.type==="choix"){
    const btns=[...scene.querySelectorAll('.choix button')];
    if(REP[e.id]!==undefined){ btns[REP[e.id]].setAttribute('aria-pressed','true'); suite.disabled=false; }
    btns.forEach(b=>b.onclick=()=>{
      btns.forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      REP[e.id]=+b.dataset.k; suite.disabled=false;
    });
    suite.onclick=()=>{i++; rendre();};
  } else if(e.type==="promesse"){
    const j=document.getElementById('jure');
    j.onchange=()=>{suite.disabled=!j.checked; REP.promesse=j.checked;};
    suite.onclick=()=>{i++; rendre();};
  } else if(suite){
    suite.onclick=()=>{i++; rendre();};
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
rendre();
</script>
</body>
</html>
