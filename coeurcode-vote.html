<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cœur Code — ton verdict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#FBF7F0; --carte:#FFFFFF; --bord:#2B2440; --bord-fin:rgba(43,36,64,.2);
  --encre:#191428; --second:#453B62; --sourd:#5E5280;
  --accent:#8A2B4A; --accent-doux:#FDEDF1;
  --tiede:#A8760C; --tiede-doux:#FBF1DE;
  --non:#5E5280; --non-doux:#EFECF5;
  --display:'Fraunces',Georgia,serif; --corps:'Manrope',system-ui,sans-serif;
  --data:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--fond);color:var(--encre);font-family:var(--corps);
  -webkit-font-smoothing:antialiased;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.enveloppe{max-width:420px;margin:0 auto}

.entete{padding:20px 2px 16px;display:flex;align-items:center;gap:12px}
.marque{font-family:var(--display);font-size:19px}
.marque .c{color:var(--accent)}
.badge{margin-left:auto;font-family:var(--data);font-size:12px;font-weight:700;color:var(--accent);
  border:2px solid var(--bord-fin);border-radius:99px;padding:7px 13px}

.ecran{display:none}
.ecran.actif{display:block;animation:monte .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes monte{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

.sur-titre{font-family:var(--data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:10px}
h1{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.16;margin-bottom:10px}
h1 em{font-style:normal;color:var(--accent)}
.chapeau{color:var(--second);font-size:15px;line-height:1.55;margin-bottom:24px}

.cartes{display:flex;flex-direction:column;gap:11px}
.carte{width:100%;display:flex;align-items:center;gap:15px;text-align:left;cursor:pointer;
  background:var(--carte);border:2px solid var(--bord-fin);border-radius:16px;padding:17px 16px;
  min-height:82px;transition:.16s;font-family:var(--corps)}
.carte:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.carte .signe{font-size:38px;line-height:1;flex:0 0 46px;text-align:center;transition:.2s}
.carte .signe.retourne{display:inline-block;transform:rotate(180deg)}
.carte .txt strong{display:block;font-size:17px;font-weight:700;margin-bottom:3px}
.carte .txt span{display:block;font-size:13.5px;line-height:1.45;color:var(--sourd)}

.carte.oui .signe{color:var(--accent)}
.carte.tiede .signe{color:var(--tiede)}
.carte.non .signe{color:var(--non)}
.carte.oui[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-doux)}
.carte.tiede[aria-pressed="true"]{border-color:var(--tiede);background:var(--tiede-doux)}
.carte.non[aria-pressed="true"]{border-color:var(--non);background:var(--non-doux)}
.carte[aria-pressed="true"] .signe{transform:scale(1.12)}
.carte.tiede[aria-pressed="true"] .signe{transform:rotate(180deg) scale(1.12)}

.primaire{width:100%;font-family:var(--corps);font-size:17px;font-weight:700;color:#fff;
  background:var(--accent);border:0;border-radius:15px;padding:19px;min-height:62px;cursor:pointer;margin-top:20px}
.primaire:disabled{background:var(--bord-fin);color:var(--sourd);cursor:not-allowed}
.primaire:not(:disabled):active{transform:scale(.985)}
.secret{font-size:13px;color:var(--sourd);text-align:center;margin-top:14px;line-height:1.5}

.fin{text-align:center;padding-top:24px}
.fin .signe{font-size:78px;line-height:1;display:inline-block}
.fin h1{margin-top:18px}
.fin p{color:var(--second);font-size:15.5px;line-height:1.6;margin-top:14px}
.rappel{margin-top:26px;padding:16px;border-radius:14px;background:var(--accent-doux);
  font-size:14px;line-height:1.55;color:var(--second);text-align:left}
.rappel b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="enveloppe">
  <header class="entete">
    <div class="marque">Cœur Code <span class="c">❤️</span></div>
    <div class="badge">n° 34</div>
  </header>

  <section class="ecran actif" id="e1">
    <p class="sur-titre">Fin du RDV</p>
    <h1>Tu viens de rencontrer <em>le 47</em>.</h1>
    <p class="chapeau">Trois réponses possibles. Personne ne saura jamais laquelle tu as choisie.</p>

    <div class="cartes">
      <button class="carte oui" type="button" aria-pressed="false" data-v="oui">
        <span class="signe">❤</span>
        <span class="txt"><strong>Oui</strong><span>J'aimerais le revoir.</span></span>
      </button>

      <button class="carte tiede" type="button" aria-pressed="false" data-v="tiede">
        <span class="signe retourne">❤</span>
        <span class="txt"><strong>Le cœur à l'envers</strong><span>Pas comme ça, mais je l'aime bien. Amis, projet, voyage.</span></span>
      </button>

      <button class="carte non" type="button" aria-pressed="false" data-v="non">
        <span class="signe">✕</span>
        <span class="txt"><strong>Non</strong><span>On en reste là.</span></span>
      </button>
    </div>

    <button class="primaire" id="valider" disabled>Envoyer mon verdict</button>
    <p class="secret">Ton vote est secret. L'autre ne verra jamais ce que tu as mis — et toi non plus.</p>
  </section>

  <section class="ecran" id="e2">
    <div class="fin">
      <span class="signe" id="finSigne">❤</span>
      <h1 id="finTitre">C'est enregistré.</h1>
      <p id="finTexte">Rejoins ton coin, le prochain RDV arrive.</p>
      <div class="rappel" id="finRappel"></div>
    </div>
  </section>
</div>

<script>
/* Cœur Code — vote à trois choix.
   oui + oui               -> match amoureux
   envers + envers         -> match amical
   oui + envers            -> match amical (le plus prudent des deux gagne)
   tout ce qui touche non  -> rien, et personne ne le sait */

const TEXTES={
  oui:{signe:"❤", rot:false, titre:"C'est envoyé.",
       texte:"Si le 47 a mis la même chose, tu le sauras. Sinon, tu n'en entendras plus parler.",
       rappel:"<b>Personne ne saura que tu as dit oui.</b> S'il n'y a pas de réciprocité, aucun message ne part — ni à toi, ni à lui."},
  tiede:{signe:"❤", rot:true, titre:"Le cœur à l'envers.",
       texte:"Tu ne fermes pas la porte, tu la déplaces. Si lui aussi, on vous le dira.",
       rappel:"<b>Le cœur à l'envers, c'est un vrai choix.</b> Beaucoup des meilleures rencontres d'une soirée ne sont pas amoureuses — un associé, un partenaire de voyage, quelqu'un avec qui parler."},
  non:{signe:"✕", rot:false, titre:"C'est noté.",
       texte:"Rejoins ton coin, le prochain RDV arrive.",
       rappel:"<b>Rien ne sera dit à personne.</b> Le 47 ne saura jamais que tu as répondu, ni ce que tu as répondu."}
};

let choix=null;
const btns=[...document.querySelectorAll('.carte')];
const valider=document.getElementById('valider');

btns.forEach(b=>b.addEventListener('click',()=>{
  btns.forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  choix=b.dataset.v;
  valider.disabled=false;
}));

valider.addEventListener('click',()=>{
  const t=TEXTES[choix];
  const s=document.getElementById('finSigne');
  s.textContent=t.signe;
  s.style.transform=t.rot?'rotate(180deg)':'none';
  s.style.color = choix==='oui' ? 'var(--accent)' : choix==='tiede' ? 'var(--tiede)' : 'var(--non)';
  document.getElementById('finTitre').textContent=t.titre;
  document.getElementById('finTexte').textContent=t.texte;
  document.getElementById('finRappel').innerHTML=t.rappel;
  document.getElementById('e1').classList.remove('actif');
  document.getElementById('e2').classList.add('actif');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
